# /etc/nginx/sites-available/chayinabat
#
# Romano — workplace coffee ordering (apps/web, apps/dashboard, apps/api).
#
# `certbot --nginx` rewrites this file in place to add the TLS blocks, so never
# overwrite it wholesale from a deploy script — that would strip HTTPS.
#
# Hosts:
#   chayinabat.ir, www.chayinabat.ir -> static SPA (apps/web)       /var/www/chayinabat/web
#   admin.chayinabat.ir              -> static SPA (apps/dashboard) /var/www/chayinabat/admin
#   both hosts: /api/                -> NestJS API on 127.0.0.1:3100
#
# The API port is 3100, not the repo default of 3000: digfon-api already holds
# 3000 on this box. Set API_PORT=3100 in the API's environment.
#
# Both Angular apps are built with apiBaseUrl '/api' (environment.production.ts),
# so each vhost must proxy /api/ itself — there is no api.chayinabat.ir. Receipt
# images are streamed by the API (GET /api/orders/:id/receipt), never from disk,
# so no /uploads location is needed.

# ── Storefront / customer app ────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name chayinabat.ir www.chayinabat.ir;

    root /var/www/chayinabat/web;
    index index.html;

    access_log /var/log/nginx/chayinabat.ir.access.log;
    error_log  /var/log/nginx/chayinabat.ir.error.log;

    # Receipts cap at 5 MB in the API (RECEIPT_MAX_BYTES); leave headroom for
    # the multipart envelope.
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Hashed build assets.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Angular SPA: every unknown path is a client route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Admin dashboard ──────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name admin.chayinabat.ir;

    root /var/www/chayinabat/admin;
    index index.html;

    access_log /var/log/nginx/admin.chayinabat.ir.access.log;
    error_log  /var/log/nginx/admin.chayinabat.ir.error.log;

    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
