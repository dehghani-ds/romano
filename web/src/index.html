<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>رومانو — قهوهٔ فردا</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="رومانوی فردا را همین امروز سفارش بدهید — تحویل سر میز شما یا نزدیک‌ترین یخچال."
    />
    <meta name="theme-color" content="#92400e" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Vazirmatn is served from our own origin: Google Fonts is unreliable for
         users in Iran, and a self-hosted variable font is one 111 KB request. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="fonts/Vazirmatn-Variable.woff2"
      crossorigin
    />
    <script>
      // Set the theme before first paint so there is no flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('romano-theme');
          var theme =
            stored ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
